<!doctype html>
<html lang="pt-br">
  <head>
    <title>Calcule o valor de seu ticket</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Calcule o valor de seu ticket" />
    <meta name="keywords" content="ticket, desconto, valor" />
    <meta name="description" content="Lhe pede um número e retorna seu antecessor e seu sucessor"/>
    <meta name="title" content="Calcule a média do aluno" />
    <meta name="keywords" content="média, aluno, nota final" />
    <meta
      name="description"
      content="Uma página que calcula a média de um aluno usando quatro valores e pede um exame de recuperação caso a média seja menor que 7."
    />
    <meta name="author" content="Gabriel Vitório dos Santos" />
    <meta http-equiv="X-UA-Compatible" content="IE=7" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h2>Digite um número e obtenha seu antecessor e sucessor:</h2>
      <form id="userForm">
        <div id="form__div--form-field" class="form__div">
          <label>Digite um número:</label>
          <input id="div__input--number" type="number" placeholder="Digite qualquer número inteiro" required autofocus>
        </div>
        <hr/>
        <div id="form__div--result" class="form__div">
          <p id="div__p--result">Aqui aparecerá o antecessor e sucessor do seu número</p>
        </div>
      </form>
    </main>
  </body>
</html>
